[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recirculation-reproduction"
version = "0.1.0"
description = "Independent inference-time implementation of transformer recirculation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["logbar>=0.4.10", "torch>=2.1"]

[project.optional-dependencies]
eval = ["datasets>=2.18", "pyyaml>=6", "transformers>=5.0"]
mlx = ["mlx>=0.31.2", "mlx-lm>=0.31.3"]
cuda = ["triton>=3.0; platform_system == 'Linux'"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["recirculation"]

[tool.ruff]
line-length = 119
target-version = "py310"
